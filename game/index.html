<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Quest - The great escape</title>
<link rel="preload" href="./fonts/baloo-2.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @font-face { font-family: 'Baloo 2'; src: url('./fonts/baloo-2.ttf') format('truetype'); font-weight: 400 800; font-style: normal; font-display: swap; }
  body { margin: 0; overflow: hidden; background: #101418; color: #e8e8e8; font: 500 15px 'Baloo 2', 'Comic Sans MS', cursive; }
  #hud { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); padding: 14px 22px;
         border-radius: 8px; background: #000b; font-size: 20px; text-align: center; pointer-events: none; }
  #help { position: absolute; bottom: 8px; left: 8px; padding: 6px 10px; border-radius: 6px; background: #0008;
          font-size: 12px; line-height: 1.6; }
  #help kbd { padding: 0 4px; border: 1px solid #fff5; border-radius: 3px; font: inherit; }
  #menu { position:absolute; top:20px; left:22px; right:22px; display:flex; justify-content:space-between; gap:16px; align-items:start; }
  .panel { background:#13211ee8; border:1px solid #7dafa044; border-radius:12px; padding:14px 18px; box-shadow:0 8px 30px #0003; }
  .brand { font-size:12px; font-weight:600; letter-spacing:.12em; color:#9bceb8; text-transform:uppercase; }
  h1 { font-size:28px; line-height:1.15; margin:7px 0; font-weight:800; }
  #description { margin:0; color:#b2c3bd; font-size:14px; line-height:1.4; max-width:380px; }
  select, button { color:#edf9ef; background:#263d34; border:1px solid #779c86; padding:8px 10px; border-radius:6px; font:inherit; cursor:pointer; }
  button:hover, select:hover { background:#3b5947; }
  #navigation { display:flex; gap:8px; flex-wrap:wrap; max-width:380px; }
  #hud { border:1px solid #a6d4b655; background:#13211ef0; font-size:20px; font-weight:600; max-width:380px; line-height:1.5; }
  #help { bottom:16px; left:22px; right:22px; width:fit-content; font-size:13px; line-height:1.5; color:#d0ded6; background:#13211edc; }
  @media(max-width:650px) { #menu { top:10px;left:10px;right:10px;flex-direction:column;gap:8px; } .panel { padding:10px; } h1 {font-size:22px;} #help {left:10px;right:10px;font-size:11px;} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="menu">
  <div class="panel"><div class="brand">Mouse Quest / ten small adventures</div><h1 id="level-title"></h1><p id="description"></p></div>
  <div class="panel" id="navigation"><select id="language" aria-label="Language / Jazyk"><option value="en">English</option><option value="cs">&#268;e&#353;tina</option></select><select id="levels" aria-label="Choose level"></select><button id="view" aria-pressed="false" title="Toggle camera (V)">Rat-eye view (V)</button><button id="retry">Restart</button><button id="next">Next level &rarr;</button></div>
</div>
<div id="hud" hidden role="status"></div><div id="surface-status" role="status" style="position:absolute;bottom:95px;left:22px;color:#ffe5a0;pointer-events:none"></div>
<div id="help"><kbd>W</kbd> / &uarr; walk &middot; <kbd>Shift</kbd> run &middot; <kbd>S</kbd> / &darr; back &middot; <kbd>A</kbd><kbd>D</kbd> / &larr; &rarr; turn<br><kbd>Space</kbd> jump &mdash; hold for height, move to leap &middot; drag to look around &middot; <kbd>V</kbd> switch view</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { createClipPlayer } from '../models/rat/viewer/clip-player.js';
import { createController, MAPPED } from '../models/rat/viewer/controller.js';
import { swingBehind } from '../models/rat/viewer/camera.js';
import { hasFallen, makeWorld, onGoal } from './collision.js';
import { advancePlatforms, resetPlatforms } from './motion.js';
import { messages, levelText, initialLanguage } from './i18n.js';
import { levels } from './level.js';
import { createIdleDirector } from './idle.js';
import { createMaterials, buildCourse, createVoid } from './scenery.js';
let motionTime = 0;
let levelIndex = 0;
let level = levels[0];

const CAMERA_BACK = 0.75; // m behind the rat
const CAMERA_UP = 0.4;    // m above it
const TARGET_UP = 0.05;   // look at a point this high above the rat's feet
let savedLanguage;
try { savedLanguage = localStorage.getItem('ratGame.language'); } catch {}
let language = initialLanguage(navigator.language, savedLanguage);
const t = key => messages[language][key];
let surfaceEffect;
const hud = document.getElementById('hud');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x182b2b);
scene.fog = new THREE.FogExp2(0x182b2b, .065);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x334455, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
const SUN_OFFSET = new THREE.Vector3(0.8, 1.5, 0.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -1, right: 1, top: 1, bottom: -1, near: 0.1, far: 4 });
scene.add(sun, sun.target);

const voidBackground = createVoid(scene);

const materials = createMaterials(renderer);
let scenery = buildCourse(scene, level, materials);
const selector = document.getElementById('levels');
levels.forEach((entry, i) => selector.add(new Option(`${i+1}. ${entry.name}`, String(i))));
let world = makeWorld(level.boxes, level.patches);

const gltf = await new GLTFLoader().loadAsync('../models/rat/dist/rat.glb');
const rat = gltf.scene;
rat.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
scene.add(rat);
// Use the midpoint of the animated eyes while keeping the horizon steady as the rat moves.
const leftEye = rat.getObjectByName('FACIAL_L_Eyeball');
const rightEye = rat.getObjectByName('FACIAL_R_Eyeball');
const eyeLeft = new THREE.Vector3(), eyeRight = new THREE.Vector3();
let firstPerson = false;
const viewButton = document.getElementById('view');
// The rat remains in shadow rendering, but cannot obscure its own eye camera.
rat.traverse(o => { if (o.isMesh) o.layers.set(1); });
camera.layers.enable(1);
sun.shadow.camera.layers.enable(1);

function updateEyeCamera() {
  rat.updateMatrixWorld(true);
  if (leftEye && rightEye) {
    leftEye.getWorldPosition(eyeLeft);
    rightEye.getWorldPosition(eyeRight);
    camera.position.copy(eyeLeft).add(eyeRight).multiplyScalar(.5);
  } else {
    camera.position.set(0, .055, .07);
    rat.localToWorld(camera.position);
  }
  const yaw = rat.rotation.y;
  camera.lookAt(camera.position.x + Math.sin(yaw), camera.position.y - .08,
    camera.position.z + Math.cos(yaw));
}

function toggleView() {
  idle.wake();
  firstPerson = !firstPerson;
  controls.enabled = !firstPerson;
  camera.layers[firstPerson ? 'disable' : 'enable'](1);
  camera.fov = firstPerson ? 80 : 50;
  camera.near = firstPerson ? .003 : .01;
  camera.updateProjectionMatrix();
  viewButton.textContent = t(firstPerson ? 'chase' : 'eye');
  viewButton.setAttribute('aria-pressed', String(firstPerson));
  placeCamera();
}
viewButton.addEventListener('click', () => { toggleView(); viewButton.blur(); });
const speeds = rat.userData.clipSpeeds ?? {};

const mixer = new THREE.AnimationMixer(rat);
const actions = Object.fromEntries(gltf.animations.map((clip) => [clip.name, mixer.clipAction(clip)]));
const player = createClipPlayer(actions, { loopOnce: THREE.LoopOnce });
const controller = createController({
  rat, actions, speeds, play: player.play, current: () => player.current, world: { step: world.step, groundHeight: (...args) => world.groundHeight(...args), move: (...args) => world.move(...args), canTurn: (...args) => world.canTurn(...args), surface: (...args) => world.surface(...args) },
});
mixer.addEventListener('finished', (e) => {
  if (e.action === player.current) controller.clipFinished(e.action.getClip().name);
});

let game = 'ready';
let idleAngle = 0;
const pointers = new Set();
const idleTarget = new THREE.Vector3(), idlePosition = new THREE.Vector3();
const idle = createIdleDirector({
  play(name) { actions[name].setEffectiveTimeScale(1); player.play(name, .2); },
  duration: name => actions[name].getClip().duration,
  onEnter() {
    controls.enabled = false;
    if (firstPerson) {
      camera.position.set(rat.position.x-Math.sin(rat.rotation.y)*CAMERA_BACK,
        rat.position.y+CAMERA_UP,rat.position.z-Math.cos(rat.rotation.y)*CAMERA_BACK);
    }
    camera.layers.enable(1); camera.fov = 50; camera.near = .01; camera.updateProjectionMatrix();
    idleAngle = Math.atan2(camera.position.x-rat.position.x,camera.position.z-rat.position.z);
    if (game === 'ready') hud.hidden = true;
  },
  onExit() {
    controls.enabled = !firstPerson;
    camera.layers[firstPerson ? 'disable' : 'enable'](1);
    camera.fov = firstPerson ? 80 : 50; camera.near = firstPerson ? .003 : .01;
    camera.updateProjectionMatrix(); placeCamera(); setGame(game);
  },
});
// Capture before OrbitControls so the first click can immediately start a drag.
addEventListener('pointerdown', e => { pointers.add(e.pointerId); idle.wake(); }, true);
addEventListener('pointerup', e => { pointers.delete(e.pointerId); idle.wake(); }, true);
addEventListener('pointercancel', e => { pointers.delete(e.pointerId); idle.wake(); }, true);
addEventListener('pointermove', () => idle.wake(), true);
addEventListener('wheel', () => idle.wake(), {capture:true,passive:true});
document.addEventListener('visibilitychange', () => { idle.wake(); controller.releaseAll(); pointers.clear(); });
function setGame(next) {
  game = next;
  hud.textContent = next === 'won' && levelIndex === levels.length - 1 ? t('final') : messages[language][next] ?? '';
  hud.hidden = !['ready','fell','won'].includes(next);
}

function placeCamera() {
  if (firstPerson) { updateEyeCamera(); return; }
  const p = rat.position;
  controls.target.set(p.x, p.y + TARGET_UP, p.z);
  camera.position.set(p.x - Math.sin(rat.rotation.y) * CAMERA_BACK, p.y + CAMERA_UP,
    p.z - Math.cos(rat.rotation.y) * CAMERA_BACK);
  controls.update();
}

function place(x, y, z, yaw) {
  idle.wake();
  rat.position.set(x, y, z);
  rat.rotation.y = yaw;
  controller.reset();
  rat.rotation.x = rat.rotation.z = 0;
  placeCamera();
}

function loadLevel(index) {
  levelIndex = (index + levels.length) % levels.length;
  level = levels[levelIndex];
  voidBackground.setLevel(level);
  controller.releaseAll();
  world = makeWorld(level.boxes, level.patches);
  scenery.dispose();
  scenery = buildCourse(scene, level, materials);
  selector.value = String(levelIndex);
  refreshLanguage();
  restart();
}
selector.addEventListener('change', () => { loadLevel(Number(selector.value)); selector.blur(); });
document.getElementById('retry').addEventListener('click', e => { restart(); e.currentTarget.blur(); });
document.getElementById('next').addEventListener('click', e => { loadLevel(levelIndex+1); e.currentTarget.blur(); });

function restart() {
  controller.releaseAll();
  motionTime = 0;
  resetPlatforms(level);
  scenery.sync();
  const { start } = level;
  place(start.x, start.top, start.z, start.yaw);
  setGame('ready');
}

addEventListener('keydown', (e) => {
  idle.wake();
  if (e.target instanceof HTMLSelectElement || e.target instanceof HTMLButtonElement) return;
  if (e.code === 'KeyV') {
    e.preventDefault();
    if (!e.repeat) toggleView();
    return;
  }
  if (!MAPPED.has(e.code)) return;
  e.preventDefault(); // no page scrolling
  if (e.repeat) return;
  if (game === 'fell' || game === 'won') {
    if (e.code === 'Space') { if (game === 'won') loadLevel(levelIndex + 1); else restart(); } // this press only restarts; it doesn't reach the rat
    return;
  }
  if (game === 'ready') setGame('playing');
  controller.press(e.code);
});
addEventListener('keyup', (e) => { idle.wake(); controller.release(e.code); });
addEventListener('blur', () => { idle.wake(); controller.releaseAll(); pointers.clear(); });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
const before = new THREE.Vector3();
const delta = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const elapsed = clock.getDelta();
  const dt = Math.min(elapsed, 0.05); // no huge physics step after a background tab
  player.step(dt);
  mixer.update(dt);
  before.copy(rat.position);
  if (game === 'playing') {
    advancePlatforms(level,motionTime+dt,rat,controller.state !== 'air');
    motionTime += dt;
    scenery.sync();
    controller.update(dt);
  }
  const surface = controller.state === 'air' ? {} : world.surface(rat.position);
  // YXZ keeps steering independent of pitch and roll.
  rat.rotation.order = 'YXZ';
  const pitch = -Math.atan((surface.slopeX ?? 0)*Math.sin(rat.rotation.y) + (surface.slopeZ ?? 0)*Math.cos(rat.rotation.y));
  const roll = Math.atan((surface.slopeX ?? 0)*Math.cos(rat.rotation.y) - (surface.slopeZ ?? 0)*Math.sin(rat.rotation.y));
  const tiltBlend = 1-Math.exp(-12*dt);
  rat.rotation.x += (pitch-rat.rotation.x)*tiltBlend;
  rat.rotation.z += (roll-rat.rotation.z)*tiltBlend;
  surfaceEffect = surface.effect;
  refreshSurfaceStatus();
  scenery.ring.rotation.y += dt;
  if (game === 'playing') {
    if (hasFallen(rat.position, level)) { controller.releaseAll(); setGame('fell'); }
    else if (onGoal(rat.position, level.goal)) { controller.releaseAll(); setGame('won'); }
  }
  idle.update(dt, !document.hidden && (game==='ready' || game==='playing')
    && controller.state==='idle' && !controller.hasInput && pointers.size===0
    && Math.abs(controller.speed)<.001 && Math.abs(rat.position.y-world.groundHeight(rat.position.x,rat.position.z,rat.position.y))<.001, elapsed);
  if (idle.active) {
    idleAngle += dt*.16;
    idleTarget.set(rat.position.x,rat.position.y+.07,rat.position.z);
    idlePosition.set(rat.position.x+Math.sin(idleAngle)*1.8,rat.position.y+.8,
      rat.position.z+Math.cos(idleAngle)*1.8);
    camera.position.lerp(idlePosition,1-Math.exp(-1.4*dt));
    controls.target.copy(idleTarget);
    camera.lookAt(idleTarget);
  } else if (firstPerson) {
    updateEyeCamera();
  } else if (game !== 'fell') { // when it falls, the camera stays put and watches it drop
    delta.subVectors(rat.position, before);
    delta.y = 0;
    camera.position.add(delta);
    controls.target.add(delta);
    // Ease the height so jumps and drops don't jerk the view.
    const dy = (rat.position.y + TARGET_UP - controls.target.y) * (1 - Math.exp(-4 * dt));
    controls.target.y += dy;
    camera.position.y += dy;
    if (controller.speed !== 0) swingBehind(camera, controls.target, rat.rotation.y, dt);
  }
  sun.position.copy(rat.position).add(SUN_OFFSET); // keep the shadow camera on the rat
  sun.target.position.copy(rat.position);
  if (!firstPerson && !idle.active) controls.update();
  voidBackground.update(camera, dt);
  renderer.render(scene, camera);
});

function refreshSurfaceStatus() {
  document.getElementById('surface-status').textContent = surfaceEffect === 'glue' || surfaceEffect === 'slip' ? t(surfaceEffect) : '';
}
function refreshLanguage() {
  document.documentElement.lang = language;
  document.title = t('title');
  document.querySelector('.brand').textContent = t('brand');
  document.getElementById('language').value = language;
  document.getElementById('language').setAttribute('aria-label',t('language'));
  selector.setAttribute('aria-label', t('chooseLevel'));
  levels.forEach((entry,i) => { selector.options[i].textContent = `${i+1}. ${levelText(entry,language).name}`; });
  const text = levelText(level,language);
  document.getElementById('level-title').textContent = `${String(levelIndex+1).padStart(2,'0')} / ${text.name}`;
  document.getElementById('description').textContent = text.description;
  document.getElementById('retry').textContent = t('retry');
  document.getElementById('next').textContent = t('next');
  viewButton.textContent = t(firstPerson ? 'chase' : 'eye');
  viewButton.title = t('camera');
  document.getElementById('help').innerHTML = t('help');
  refreshSurfaceStatus();
  setGame(game);
}
document.getElementById('language').addEventListener('change', e => {
  language = e.target.value;
  try { localStorage.setItem('ratGame.language',language); } catch {}
  refreshLanguage();
  e.target.blur();
});
loadLevel(0);
window.ratGame = {
  get state() { return game; },
  get ctrlState() { return controller.state; },
  get speed() { return controller.speed; },
  get idleMode() { return idle.active; },
  get animation() { return player.current?.getClip().name; },
  rat, camera,
  get view() { return firstPerson ? 'first-person' : 'chase'; },
  get level() { return level; },
  get levelIndex() { return levelIndex; },
  get language() { return language; },
  get motionTime() { return motionTime; },
  get levelCount() { return levels.length; },
  loadLevel,
  key(code, pressed) { // for scripted tests: same path as real key events
    dispatchEvent(new KeyboardEvent(pressed ? 'keydown' : 'keyup', { code }));
  },
  teleport: place,
};
</script>
</body>
</html>
